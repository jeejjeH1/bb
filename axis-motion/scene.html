<!doctype html><html><head><meta charset="utf-8"><style>
:root{--g:#0BB037;--k:#000;--w:#fff}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'Inter Display','Inter',sans-serif;color:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden}
.sc{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.h1{font-weight:800;letter-spacing:-.035em;line-height:1.02}
.g{color:var(--g)}
.tag{font-weight:600;letter-spacing:.22em;font-size:26px;color:var(--g);text-transform:uppercase}
.word{display:inline-block;will-change:transform,opacity}
.node{position:absolute;width:300px;height:92px;border:3px solid #fff;border-radius:46px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:32px;background:#000}
.badge{position:absolute;font-weight:700;font-size:34px;padding:16px 34px;border-radius:50px}
</style></head><body><div id="stage">
<canvas id="bg" width="1920" height="1080" class="abs" style="left:0;top:0"></canvas>
<div id="s1" class="sc"></div><div id="s2" class="sc"></div><div id="s3" class="sc"></div>
<div id="s4" class="sc"></div><div id="s5" class="sc"></div><div id="s6" class="sc"></div>
<div id="flash" class="abs" style="inset:0;background:#0BB037;opacity:0"></div>
<div id="bar" class="abs" style="left:0;bottom:0;height:8px;background:#0BB037;width:0"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),4), eio=x=>{x=cl(x);return x<.5?8*x**4:1-Math.pow(-2*x+2,4)/2};
const eb=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const seg=(t,a,d)=>cl((t-a)/d);
// logo svg
const RAYS=[[90,40,5],[270,40,5],[0,40,5],[180,40,5],[135,34,4],[45,31,4],[225,34,4],[315,36,4],[112,32,3],[158,30,3],[68,30,3],[22,31,3],[202,30,3],[248,32,3],[292,31,3],[338,30,3]];
function logo(size,color,id,prog){ // prog 0..1 ray growth
 let s=`<svg id="${id}" width="${size}" height="${size}" viewBox="0 0 100 100" style="overflow:visible">`;
 RAYS.forEach(([a,l,w],i)=>{const L=l*prog;s+=`<line x1="50" y1="50" x2="${50+Math.cos(a*Math.PI/180)*(14+L)}" y2="${50-Math.sin(a*Math.PI/180)*(14+L)}" stroke="${color}" stroke-width="${w}" stroke-linecap="butt"/>`});
 return s+`<circle cx="50" cy="50" r="17" fill="${color}"/></svg>`}
// bg
const bg=$('bg').getContext('2d');
function drawBg(t){bg.fillStyle='#000';bg.fillRect(0,0,1920,1080);
 const off=(t*40)%80;bg.strokeStyle='rgba(11,176,55,.10)';bg.lineWidth=1;
 for(let x=-80+off;x<1920;x+=80){bg.beginPath();bg.moveTo(x,0);bg.lineTo(x,1080);bg.stroke()}
 for(let y=-80+off;y<1080;y+=80){bg.beginPath();bg.moveTo(0,y);bg.lineTo(1920,y);bg.stroke()}
 const g=bg.createRadialGradient(960,540,0,960,540,900);g.addColorStop(0,'rgba(11,176,55,.10)');g.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=g;bg.fillRect(0,0,1920,1080);
 const y=((t*300)%1400)-160;const l=bg.createLinearGradient(0,y-80,0,y+80);l.addColorStop(0,'rgba(11,176,55,0)');l.addColorStop(.5,'rgba(11,176,55,.07)');l.addColorStop(1,'rgba(11,176,55,0)');bg.fillStyle=l;bg.fillRect(0,y-80,1920,160)}
// helpers
function words(txt,cls,style){return txt.split(' ').map(w=>`<span class="word ${cls?'':''}" style="${style||''}">${w}</span>`).join(' ')}
// ---- scenes
$('s1').innerHTML=`<div class="abs" id="lg" style="left:810px;top:290px"></div>
<div class="abs h1" id="wm" style="left:0;width:1920px;top:700px;text-align:center;font-size:96px;letter-spacing:.12em;font-weight:700">AXIS ROBOTICS</div>
<div class="abs tag" id="wm2" style="left:0;width:1920px;top:830px;text-align:center">Infrastructure for Physical AI</div>`;
$('s2').innerHTML=`<div class="abs tag" style="left:140px;top:210px">01 — The thesis</div>
<div class="abs h1" id="h2" style="left:140px;top:290px;width:1640px;font-size:132px">${words('The next robotics breakthrough might not come from bigger models.')}<br><span class="g">${words('It might come from better data.')}</span></div>`;
// scene3: diversity grid
let g3='';for(let i=0;i<40;i++){const r=i%5,c=(i/5|0);g3+=`<div class="abs gi" style="left:${1000+r*150}px;top:${230+c*84}px;width:110px;height:56px;border-radius:${[28,6,28,6,16][(i*7)%5]}px;border:3px solid ${i%7==0?'#0BB037':'#fff'};background:${i%7==0?'#0BB037':'transparent'}"></div>`}
$('s3').innerHTML=`<div class="abs tag" style="left:140px;top:210px">02 — The data bottleneck</div>
<div class="abs h1" id="h3" style="left:140px;top:290px;width:800px;font-size:100px">${words('Robots ace demos.')}<br><span class="g">${words('Reality is messier.')}</span></div>
<div class="abs" id="p3" style="left:140px;top:640px;width:760px;font-size:44px;line-height:1.3;font-weight:500;color:#cfcfcf">Different objects. Different places. Unexpected situations.</div>${g3}`;
// scene4: loop
const steps=['Generate tasks','Collect demos','Train models','Analyze failures'];
const P=[[960,250],[1360,540],[960,830],[560,540]];
let n4='';steps.forEach((s,i)=>{n4+=`<div class="node n4" style="left:${P[i][0]-150}px;top:${P[i][1]-46}px">${s}</div>`});
$('s4').innerHTML=`<div class="abs tag" style="left:140px;top:140px">03 — The compounding data engine</div>
<svg class="abs" width="1920" height="1080" style="left:0;top:0"><ellipse id="ring" cx="960" cy="540" rx="400" ry="290" fill="none" stroke="#0BB037" stroke-width="4" stroke-dasharray="14 12"/><circle id="dot" r="16" fill="#0BB037"/></svg>${n4}
<div class="abs" id="lp" style="left:810px;top:420px;width:300px;text-align:center"></div>
<div class="abs h1" id="rp" style="left:660px;top:600px;width:600px;text-align:center;font-size:44px;color:#0BB037">Repeat ↻</div>`;
// scene5: sim to real
$('s5').innerHTML=`<div class="abs tag" style="left:140px;top:210px">04 — Simulation → Reality</div>
<div class="abs h1" id="h5" style="left:140px;top:290px;width:1640px;font-size:112px">${words('Success in sim')}<br><span class="g">${words("isn't success in the real world.")}</span></div>
<div class="badge" id="b1" style="left:140px;top:760px;background:#0BB037;color:#000">Browser simulation</div>
<div class="abs" id="arr" style="left:600px;top:775px;font-size:60px;font-weight:700">→</div>
<div class="badge" id="b2" style="left:720px;top:760px;border:3px solid #fff">Physics · friction · perception · hardware</div>`;
$('s6').innerHTML=`<div class="abs" id="lg6" style="left:100px;top:160px"></div>
<div class="abs h1" id="h6" style="left:100px;top:600px;width:1720px;text-align:center;font-size:128px">${words('Data is the')} <span class="g">${words('bottleneck.')}</span></div>
<div class="abs" id="q6" style="left:100px;top:790px;width:1720px;text-align:center;font-size:44px;font-weight:500;color:#cfcfcf">Data · Compute · Real-world generalization — which one?</div>
<div class="abs" id="u6" style="left:660px;top:900px;width:600px;text-align:center;font-size:42px;font-weight:700;background:#0BB037;color:#000;border-radius:60px;padding:18px 0">axisrobotics.ai</div>`;
$('lg').innerHTML=logo(300,'#fff','lgs',0);$('lg6').innerHTML=logo(170,'#0BB037','lgs6',1);
$('lg6').style.left='875px';$('lg6').style.top='400px';
const T=[[0,2.2],[2.0,4.6],[4.4,6.2],[6.0,7.7],[7.5,9.0],[8.8,10]];
function fade(el,t,a,b,dx=0,dy=0){const i=eo(seg(t,a,.45)),o=1-eio(seg(t,b-.4,.4));const v=Math.min(i,o);el.style.opacity=v;el.style.transform=`translate(${dx*(1-v)}px,${dy*(1-v)}px)`}
function stagger(el,t,a,gap=.08,rise=60){[...el.querySelectorAll('.word')].forEach((w,i)=>{const p=eb(seg(t,a+i*gap,.55));w.style.opacity=cl(p*2);w.style.transform=`translateY(${(1-p)*rise}px)`})}
function render(t){drawBg(t);
 [1,2,3,4,5,6].forEach((n,i)=>{const [a,b]=T[i];const el=$('s'+n);el.style.display=(t>=a-.01&&t<=b+.01)?'block':'none'});
 // s1
 let l=t;if(t<2.3){const sv=$('lgs');const p=eo(seg(l,.1,.9));sv.querySelectorAll('line').forEach((ln,i)=>{const [a,len]=RAYS[i];const L=len*cl(eb(seg(l,.1+i*.03,.7)),0,1.15);ln.setAttribute('x2',50+Math.cos(a*Math.PI/180)*(14+L));ln.setAttribute('y2',50-Math.sin(a*Math.PI/180)*(14+L))});
  sv.style.transform=`rotate(${(1-p)*-180}deg) scale(${.2+.8*p+(l>1.2?Math.sin(seg(l,1.2,.5)*Math.PI)*.08:0)})`;sv.style.opacity=cl(p*3);
  $('wm').style.opacity=eo(seg(l,.8,.5));$('wm').style.transform=`translateY(${(1-eo(seg(l,.8,.5)))*40}px)`;$('wm').style.letterSpacing=(.4-.28*eo(seg(l,.8,.9)))+'em';
  $('wm2').style.opacity=eo(seg(l,1.2,.5));
  $('s1').style.opacity=1-eio(seg(t,1.8,.4));}
 // s2
 if(t>=2){const lt=t-2.0;$('s2').style.opacity=Math.min(1,eo(seg(lt,0,.2)))*(1-eio(seg(t,4.2,.4)));stagger($('h2'),lt,.2,.09,70);}
 // s3
 if(t>=4.4&&t<=6.25){const lt=t-4.4;$('s3').style.opacity=Math.min(eo(seg(lt,0,.2)),1-eio(seg(t,5.85,.4)));stagger($('h3'),lt,.1,.08,60);$('p3').style.opacity=eo(seg(lt,.7,.4));
  document.querySelectorAll('.gi').forEach((e,i)=>{const p=eb(seg(lt,.15+i*.018,.45));e.style.opacity=cl(p*2);e.style.transform=`scale(${p}) rotate(${(1-p)*40}deg)`})}
 // s4
 if(t>=6&&t<=7.75){const lt=t-6;$('s4').style.opacity=Math.min(eo(seg(lt,0,.2)),1-eio(seg(t,7.35,.4)));
  document.querySelectorAll('.n4').forEach((e,i)=>{const p=eb(seg(lt,.1+i*.18,.45));e.style.opacity=cl(p*2);e.style.transform=`scale(${p})`;const on=((lt*2.2)|0)%4===i&&lt>.8;e.style.background=on?'#0BB037':'#000';e.style.color=on?'#000':'#fff';e.style.borderColor=on?'#0BB037':'#fff'});
  const ang=lt*Math.PI*2*1.1-Math.PI/2;$('dot').setAttribute('cx',960+400*Math.cos(ang));$('dot').setAttribute('cy',540+290*Math.sin(ang));
  $('ring').style.opacity=eo(seg(lt,0,.5));$('rp').style.opacity=eo(seg(lt,.9,.4));
  $('lp').innerHTML='';}
 // s5
 if(t>=7.5&&t<=9.05){const lt=t-7.5;$('s5').style.opacity=Math.min(eo(seg(lt,0,.2)),1-eio(seg(t,8.65,.4)));stagger($('h5'),lt,.05,.07,50);
  const b1=eb(seg(lt,.5,.5)),b2=eb(seg(lt,.8,.5));$('b1').style.opacity=cl(b1);$('b1').style.transform=`scale(${b1})`;$('b2').style.opacity=cl(b2);$('b2').style.transform=`scale(${b2})`;$('arr').style.opacity=eo(seg(lt,.7,.3));$('arr').style.left=(600+Math.sin(lt*10)*10)+'px';
  $('b1').style.left='140px';$('arr').style.left=(560+Math.sin(lt*10)*10)+'px';$('b2').style.left='680px'}
 // s6
 if(t>=8.8){const lt=t-8.8;$('s6').style.opacity=eo(seg(lt,0,.3));const p=eb(seg(lt,0,.5));$('lg6').style.transform=`scale(${p}) rotate(${t*60}deg)`;stagger($('h6'),lt,.15,.08,50);$('q6').style.opacity=eo(seg(lt,.55,.3));const u=eb(seg(lt,.7,.4));$('u6').style.opacity=cl(u);$('u6').style.transform=`scale(${u})`}
 // flashes at transitions
 const fl=[2.0,4.4,6.0,7.5,8.8].reduce((m,x)=>Math.max(m,Math.max(0,1-Math.abs(t-x-.1)/.12)*.35),0);$('flash').style.opacity=fl;
 $('bar').style.width=(t/10*1920)+'px';}
window.render=render;render(0);
</script></body></html>
