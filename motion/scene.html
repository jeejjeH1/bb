<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(anton.woff2)}
html,body{margin:0;background:#0b0a07}canvas{display:block}
</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720,GOLD='#ffc61a',HI='#fff07a',INK='#0b0a07',DUR=10;
const cv=document.getElementById('c'),x=cv.getContext('2d');
const img={};
const load=n=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='../assets/'+n;});
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>1-Math.pow(1-clamp(t),3);
const back=t=>{t=clamp(t);const c=2.2;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const rng=s=>()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
const seg=(t,a,b)=>clamp((t-a)/(b-a));

function speedLines(cx,cy,t,alpha,inner=120,col=GOLD){
  const r=rng(7);x.save();x.globalAlpha=alpha;x.fillStyle=col;
  for(let i=0;i<90;i++){
    const a=r()*Math.PI*2,len=300+r()*900,w=.01+r()*.03,off=((t*(1.5+r()*2)+r())%1);
    const r0=inner+off*600,r1=r0+len*.5;
    x.beginPath();x.moveTo(cx+Math.cos(a-w)*r0,cy+Math.sin(a-w)*r0);
    x.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.lineTo(cx+Math.cos(a+w)*r0,cy+Math.sin(a+w)*r0);x.fill();
  }
  x.restore();
}
function halftone(t,alpha,col=GOLD,step=22){
  x.save();x.fillStyle=col;x.globalAlpha=alpha;
  for(let j=0;j<H/step+1;j++)for(let i=0;i<W/step+1;i++){
    const px=i*step+(j%2)*step/2,py=j*step;
    const d=Math.hypot(px-W*.75,py-H*.5)/900;
    const s=clamp(1-d+Math.sin(t*3+i*.3)*.08)*step*.38;
    if(s>.5){x.beginPath();x.arc(px,py,s,0,7);x.fill();}
  }
  x.restore();
}
function bolt(x1,y1,x2,y2,d,r){
  if(!d)return[[x1,y1],[x2,y2]];
  const L=Math.hypot(x2-x1,y2-y1),mx=(x1+x2)/2+(r()-.5)*L*.35,my=(y1+y2)/2+(r()-.5)*L*.35;
  return bolt(x1,y1,mx,my,d-1,r).concat(bolt(mx,my,x2,y2,d-1,r).slice(1));
}
function lightning(t,alpha){
  const k=Math.floor(t*14),r=rng(k*977+3);
  for(let n=0;n<3;n++){
    const p=bolt(W*(.2+r()*.7),-10,W*(.1+r()*.8),H*(.5+r()*.5),6,r);
    x.save();x.globalAlpha=alpha*(1-(t*14%1)*.6);x.lineJoin='round';x.shadowColor=GOLD;x.shadowBlur=28;
    x.strokeStyle=GOLD;x.lineWidth=8;x.beginPath();p.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.stroke();
    x.strokeStyle='#fffbe0';x.lineWidth=2.5;x.shadowBlur=6;x.stroke();x.restore();
  }
}
function text(s,cx,cy,size,col,o={}){
  x.save();x.translate(cx,cy);x.rotate(o.rot||0);x.transform(1,0,-.14,1,0,0);x.scale(o.sx||1,o.sy||1);
  x.font=`${size}px Anton`;x.textAlign='center';x.textBaseline='middle';
  if(o.shadow){x.fillStyle='#000';x.fillText(s,o.shadow,o.shadow);}
  if(o.stroke){x.lineWidth=o.stroke;x.strokeStyle=o.sc||'#000';x.strokeText(s,0,0);}
  x.fillStyle=col;x.globalAlpha=o.a??1;x.fillText(s,0,0);x.restore();
}
function panel(cx,cy,w,h,col,rot=-.06){
  x.save();x.translate(cx,cy);x.rotate(rot);x.fillStyle=col;
  x.beginPath();x.moveTo(-w/2+30,-h/2);x.lineTo(w/2,-h/2);x.lineTo(w/2-30,h/2);x.lineTo(-w/2,h/2);x.closePath();x.fill();x.restore();
}
function cover(im,cx,cy,w,h,sc=1,ox=0){
  const s=Math.max(w/im.width,h/im.height)*sc;x.save();x.beginPath();x.rect(cx-w/2,cy-h/2,w,h);x.clip();
  x.drawImage(im,cx-im.width*s/2+ox,cy-im.height*s/2,im.width*s,im.height*s);x.restore();
}
function shake(a,t){return[(Math.sin(t*90)*a),(Math.cos(t*77)*a)];}
function flash(t,at,dur=.25,s=.8){const p=seg(t,at,at+dur);if(p>0&&p<1){x.save();x.globalAlpha=(1-p)*s;x.fillStyle=HI;x.fillRect(0,0,W,H);x.restore();}}

function draw(t){
  x.setTransform(1,0,0,1,0,0);x.fillStyle=INK;x.fillRect(0,0,W,H);
  // camera shake on impacts
  let sh=0;[1.25,1.6,1.95,2.3,2.65,3.0,5.2,6.4,7.6].forEach(a=>{const p=seg(t,a,a+.3);if(p>0&&p<1)sh=Math.max(sh,(1-p)*10);});
  const [sx,sy]=shake(sh,t);x.save();x.translate(sx,sy);

  // ---- scene 1 (0-1.3): halftone + burst ----
  if(t<3.4){halftone(t,.22*(1-seg(t,3,3.4)));}
  if(t<1.3){
    const p=seg(t,0,1.1);
    x.save();x.fillStyle=GOLD;x.beginPath();x.arc(W/2,H/2,ease(p)*40,0,7);x.fill();x.restore();
    speedLines(W/2,H/2,t,.9*(1-seg(t,1,1.3)),60+ease(p)*200,HI);
  }

  // ---- scene 2 (1.2-3.4): PFP slam + MASTER letters ----
  if(t>1.2&&t<3.6){
    const out=1-ease(seg(t,3.2,3.6));
    const p=back(seg(t,1.2,1.7));
    speedLines(W*.3,H*.5,t,.5*out,200);
    x.save();x.translate(W*.28,H*.5);x.rotate(-.05);x.scale(p*out,p*out);
    x.fillStyle=GOLD;x.fillRect(-250+22,-250+22,500,500);
    x.drawImage(img.pfp,-250,-250,500,500);x.lineWidth=8;x.strokeStyle=INK;x.strokeRect(-250,-250,500,500);x.restore();
    const L='MASTER';
    for(let i=0;i<L.length;i++){
      const a=1.45+i*.18,pp=back(seg(t,a,a+.28));
      if(pp>0)text(L[i],W*.5+60+i*104,H*.5-30+(1-ease(seg(t,a,a+.2)))*-300,190,i%2?'#fffaf0':GOLD,{shadow:9,sx:pp,sy:pp,a:out});
    }
    x.save();x.globalAlpha=out*ease(seg(t,2.7,3.1));
    panel(W*.5+300,H*.5+130,600,70,GOLD);text('MOTION GRAPHICS CREATOR',W*.5+300,H*.5+130,40,INK);x.restore();
  }

  // ---- scene 3 (3.4-5.4): lightning + hero art ----
  if(t>3.3&&t<5.6){
    const p=ease(seg(t,3.3,3.9)),out=1-ease(seg(t,5.2,5.6));
    x.save();x.globalAlpha=out;
    x.save();x.beginPath();x.moveTo(W*(1-.72*p),0);x.lineTo(W,0);x.lineTo(W,H);x.lineTo(W*(1-.72*p)-120,H);x.closePath();x.clip();
    cover(img.hero,W*.7,H/2,W*.9,H,1.08+seg(t,3.3,5.6)*.12,-40+(1-p)*200);x.restore();
    x.restore();
    lightning(t,.9*out);
    const a=ease(seg(t,3.7,4.1));
    x.save();x.globalAlpha=out;
    text('I MAKE',W*.2+(1-a)*-500,H*.32,150,'#fffaf0',{shadow:8});
    text('IT MOVE',W*.23+(1-ease(seg(t,3.95,4.35)))*-500,H*.58,190,GOLD,{shadow:9});
    x.restore();
  }

  // ---- scene 4 (5.2-7.7): rapid brand cuts ----
  if(t>5.2&&t<7.8){
    const names=['GENLAYER','SEISMIC','STARTALE','KAST'],beat=.55,i=Math.min(3,Math.floor((t-5.3)/beat));
    const lt=(t-5.3)-i*beat;
    if(t>5.3){
      const out=1-ease(seg(t,7.5,7.8));
      x.save();x.globalAlpha=out;
      x.fillStyle=i%2?INK:GOLD;x.fillRect(0,0,W,H);
      speedLines(W/2,H/2,t,.35,260,i%2?GOLD:INK);
      const s=back(seg(lt,0,.2));
      text(names[i],W/2,H/2,Math.min(260,1300/names[i].length*1.2),i%2?GOLD:INK,{shadow:12,sx:s,sy:s,rot:-.05});
      text(`0${i+1} / 04`,W*.12,H*.1,36,i%2?'#fffaf0':INK);
      x.restore();
    }
  }

  // ---- scene 5 (7.5-10): banner finale ----
  if(t>7.5){
    const p=ease(seg(t,7.5,8.1));
    x.save();x.globalAlpha=p;halftone(t,.3);cover(img.banner,W/2,H*.4,W,W/img.banner.width*img.banner.height,1+seg(t,7.5,10)*.06);x.restore();
    lightning(t,.5*seg(t,8,8.3)*(1-seg(t,9.4,10)));
    x.save();x.globalAlpha=ease(seg(t,8,8.4));
    panel(W*.5,H*.86,720,100,GOLD,-.04);text('@0xMASTER82',W*.5,H*.86,84,INK,{rot:-.04});
    x.restore();
  }
  x.restore();
  flash(t,1.2,.35);flash(t,3.3,.3,.9);flash(t,5.2,.25,.8);flash(t,7.5,.3,.9);
  // outro fade
  const fo=seg(t,9.55,10);if(fo>0){x.fillStyle=`rgba(11,10,7,${fo})`;x.fillRect(0,0,W,H);}
  // vignette
  const g=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');x.fillStyle=g;x.fillRect(0,0,W,H);
}
window.ready=(async()=>{
  await document.fonts.load('100px Anton');
  img.pfp=await load('pfp.jpg');img.hero=await load('hero.jpg');img.banner=await load('banner-master.jpg');
  window.draw=draw;window.DUR=DUR;return true;
})();
</script>
